<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Driver Dashboard | Smart Auto</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

    <nav class="navbar">

        <div class="logo">
            🚗 Smart Auto
        </div>

        <div class="nav-links">

            <span>
                Welcome, {{ session["user_name"] }}
            </span>

            <a href="/logout">
                Logout
            </a>

        </div>

    </nav>


    <section class="dashboard">

        <div class="dashboard-header">

            <div>

                <h1>
                    Driver Dashboard
                </h1>

                <p>
                    Manage your auto and trips
                </p>

            </div>

        </div>


        <div class="dashboard-grid">

            <div class="dashboard-card">

                <h3>🚗 Auto</h3>

                <p>
                    Auto Number
                </p>

                <strong>
                    {{ auto_number }}
                </strong>

            </div>


            <div class="dashboard-card">

                <h3>🪑 Seats</h3>

                <p>
                    Available
                </p>

                <strong>
                    3 / 3
                </strong>

            </div>


            <div class="dashboard-card">

                <h3>📍 Status</h3>

                <p>
                    Current Status
                </p>

                <strong>
                    AVAILABLE
                </strong>

            </div>

        </div>


        <div class="trip-panel">

            <h2>
                Start a Trip
            </h2>


            <form method="POST"
                  action="/driver/start-trip">

                <label>
                    Select Route
                </label>

                <select name="route_id" required>

                    <option value="">
                        Select a route
                    </option>

                    {% for route in routes %}

                    <option value="{{ route.id }}">

                        {{ route.route_name }}

                    </option>

                    {% endfor %}

                </select>


                <button type="submit">
                    🚗 Start Trip
                </button>

            </form>

        </div>

    </section>

</body>

</html>
