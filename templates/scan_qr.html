<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Scan QR - Smart Auto</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

    <!-- QR Scanner Library -->
    <script src="https://unpkg.com/html5-qrcode"
            type="text/javascript"></script>

</head>

<body>

<div class="dashboard-container">

    <div class="dashboard-content">

        <h1>📷 Scan Auto QR</h1>

        <p>
            Scan the QR code displayed by the selected auto driver.
        </p>

        <p>
            <strong>Selected Trip:</strong>
            {{ selected_trip_id }}
        </p>


        <!-- QR Scanner -->

        <div id="reader"
             style="width: 100%; max-width: 500px; margin: 20px auto;">
        </div>


        <p id="scan-status">
            Waiting for QR code...
        </p>


        <br>

        <a href="{{ url_for('dashboard') }}">
            ← Back to Dashboard
        </a>

    </div>

</div>


<script>

const selectedTripId = "{{ selected_trip_id }}";


function onScanSuccess(decodedText, decodedResult) {

    console.log("QR Code:", decodedText);

    document.getElementById("scan-status").innerText =
        "QR detected! Checking trip...";


    /*
        QR should contain something like:

        http://127.0.0.1:5000/board/12

        or

        https://192.168.0.105:5000/board/12
    */


    const match = decodedText.match(/\/board\/(\d+)/);


    if (!match) {

        document.getElementById("scan-status").innerText =
            "Invalid Smart Auto QR code.";

        return;
    }


    const scannedTripId = match[1];


    console.log("Selected Trip:", selectedTripId);
    console.log("Scanned Trip:", scannedTripId);


    /*
        Make sure the passenger scans the QR
        belonging to the auto they selected.
    */

    if (scannedTripId !== selectedTripId) {

        document.getElementById("scan-status").innerText =
            "❌ Wrong auto QR. Please scan the QR of your selected auto.";

        return;
    }


    document.getElementById("scan-status").innerText =
        "✅ Correct auto QR! Boarding...";


    /*
        Open the boarding page.
    */

    window.location.href =
        "/board/" + scannedTripId;

}


function onScanFailure(error) {

    // Scanner continuously searches.
    // No need to show every scan failure.

}


const scanner = new Html5QrcodeScanner(
    "reader",
    {
        fps: 10,
        qrbox: {
            width: 250,
            height: 250
        }
    },
    false
);


scanner.render(
    onScanSuccess,
    onScanFailure
);

</script>

</body>

</html>
